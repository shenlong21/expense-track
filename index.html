<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0f766e">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Expenses</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-rounded.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/views/material.css">
  <link rel="stylesheet" href="css/views/winui.css">
  <link rel="stylesheet" href="css/views/ios.css">
</head>
<body>
  <div id="app" hidden>
    <header>
      <button id="back" class="icon" aria-label="Back" hidden>&#8249;</button>
      <h1 id="title">Expenses</h1>
      <button id="menu-btn" class="icon" aria-label="Menu">&#8942;</button>
      <div id="menu" class="menu" hidden>
        <button class="switch-view" data-home="main" type="button">List view</button>
        <button class="switch-view" data-home="notebook" type="button">Notebook view</button>
        <button class="switch-view" data-home="material" type="button">Material view</button>
        <button class="switch-view" data-home="winui" type="button">WinUI view</button>
        <button class="switch-view" data-home="ios" type="button">iOS view</button>
        <button id="go-charts" type="button">Analytics</button>
        <button id="go-tags" type="button">Tags</button>
        <button id="go-recurring" type="button">Recurring</button>
        <button id="export" type="button">Back up (CSV)</button>
        <button id="import" type="button">Restore from CSV</button>
        <div id="backup-note" class="menu-note"></div>
      </div>
    </header>

    <section id="view-main" class="view">
      <div id="months"></div>
    </section>

    <section id="view-notebook" class="view" hidden>
      <div id="nb-page"></div>
      <div id="nb-more"></div>
    </section>

    <section id="view-material" class="view" hidden></section>

    <section id="view-winui" class="view" hidden></section>

    <section id="view-ios" class="view" hidden></section>

    <section id="view-charts" class="view charts" hidden></section>

    <section id="view-tags" class="view" hidden></section>

    <section id="view-recurring" class="view" hidden>
      <p class="hint">Added automatically on that day each month. Day 31 falls on the last day of shorter months.</p>
      <div id="recurring-entry"></div>
      <div id="recurring-list"></div>
    </section>

    <div id="entry"></div>
  </div>

  <input id="import-file" type="file" accept=".csv,text/csv" hidden>

  <div id="toast" class="toast" role="status" hidden>
    <span id="toast-msg"></span>
    <button id="toast-action" type="button" hidden></button>
  </div>

  <script src="js/local.js"></script>
  <script src="js/app.js"></script>
  <script src="js/views/notebook.js"></script>
  <script src="js/views/material.js"></script>
  <script src="js/views/winui.js"></script>
  <script src="js/views/ios.js"></script>
  <script src="js/tags.js"></script>
</body>
</html>
